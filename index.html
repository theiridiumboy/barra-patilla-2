<!--
BARRA DE PATILLA 2 — banner 980x200, tres especiales de investigación.
Mismo ADN visual y misma técnica de escala responsiva que Barra de Patilla 1
(el reloj de la mesa de diálogo, en ~/proyectos/reloj-flip): container-type:
inline-size + aspect-ratio 980/200, sin breakpoints.
Estilo aprobado por Rory en artifact de Claude (v17, 2026-09-16). Contenido
actualizado a mano (editar, commit, push), igual que Barra 1.
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Barra de Patilla 2 — Especiales de investigación</title>
<style>
  :root{
    --lp-red: #ff0400;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: #000;
    width: 100%;
  }

  .banner-wrap{
    container-type: inline-size;
    width: 100%;
    max-width: 980px;
    aspect-ratio: 980 / 200;
    overflow: hidden;
    border-radius: 4px;
  }

  .banner{
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #000;
  }

  .half{
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    overflow: hidden;
    display: block;
    color: #fff;
    text-decoration: none;
  }

  .half:focus-visible{
    outline: 3px solid #fff;
    outline-offset: -4px;
  }

  .half:hover .enter-btn,
  .half:focus-visible .enter-btn{
    text-decoration: underline;
  }

  .fresh:hover .enter-btn,
  .fresh:focus-visible .enter-btn{
    background: #fff;
    color: var(--lp-red);
    text-decoration: none;
  }

  .half:hover .headline,
  .half:focus-visible .headline{
    text-decoration: underline;
  }

  .half .bg{
    position: absolute;
    inset: -8%;
    background-size: cover;
    background-position: center;
    animation-duration: 17s;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }

  .bg-hospitales{
    background-image: url('img/hospitales.jpg');
    animation-name: kb-zoom-pan-a;
  }

  .bg-terremoto{
    background-image: url('img/terremoto.jpg');
    filter: brightness(.78);   /* foto del refugio muy cargada: baja para que el tag rojo se lea */
    animation-name: kb-zoom-pan-b;
  }

  .bg-torturas{
    background: radial-gradient(120% 140% at 30% 20%, #2a0e0e 0%, #120505 55%, #050202 100%);
  }

  .bg-torturas .render{
    position: absolute;
    right: -6%;
    bottom: -10%;
    width: 78%;
    filter: grayscale(.6) brightness(.85) contrast(1.08) drop-shadow(0 10px 24px rgba(0,0,0,.6));
    animation: kb-zoom-pan-b 17s ease-in-out infinite alternate;
  }

  @keyframes kb-zoom-pan-a{
    0%   { transform: scale(1) translate(0,0); }
    100% { transform: scale(1.14) translate(-2%, -1.5%); }
  }
  @keyframes kb-zoom-pan-b{
    0%   { transform: scale(1) translate(0,0); }
    100% { transform: scale(1.1) translate(-2%, 2%); }
  }

  .overlay{
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 32%, rgba(0,0,0,.55) 66%, rgba(0,0,0,.9) 100%);
  }

  .brand-mark{
    position: absolute;
    right: 2.45%;
    bottom: 4%;
    height: clamp(17px, 3.35cqw, 33px);
    width: auto;
    opacity: .55;
    pointer-events: none;
  }

  /* con tres tarjetas, bajo ~600px cada una queda de ~200x40: solo cabe
     el titular. Tag y botón fuera; la tarjeta entera sigue siendo el link. */
  @container (max-width: 600px){
    .brand-mark, .copy .tag, .copy .enter-btn{ display: none; }
    .copy .headline{ -webkit-line-clamp: 3; }
  }

  .copy{
    position: absolute;
    left: 3.67%;
    right: 3.67%;
    bottom: 7%;
  }

  .tag{
    font-size: clamp(8px, 1.05cqw, 10px);
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
    display: block;
    margin-bottom: .5em;
  }

  /* punto rojo de marca: el rojo sobre foto no se leía, el blanco sí */
  .tag::before{
    content: '';
    display: inline-block;
    width: .7em;
    height: .7em;
    margin-right: .55em;
    border-radius: 50%;
    background: var(--lp-red);
    vertical-align: -.02em;
  }

  .headline{
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(13px, 3cqw, 21px);
    font-weight: 700;
    line-height: 1.15;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 2.3em;   /* siempre dos líneas de alto: tag, titular y CTA alineados en las tres tarjetas */
  }

  /* CTA discreto: la tarjeta entera ya es el link. Solo el especial más
     nuevo (.fresh) lleva la pastilla roja con pulso. */
  .enter-btn{
    display: inline-block;
    margin-top: .8em;
    padding: .48em 0;
    color: #fff;
    font-size: clamp(7px, 1.35cqw, 10.5px);
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
  }

  .fresh .enter-btn{
    padding: .48em 1.3em;
    background: var(--lp-red);
    text-shadow: none;
    border-radius: 999px;
    box-shadow: 0 0 0 0 rgba(255,4,0,.55);
    animation: enter-pulse 3s ease-in-out infinite;
  }

  @keyframes enter-pulse{
    0%, 100%{ transform: scale(1); box-shadow: 0 0 0 0 rgba(255,4,0,.55); }
    50%{ transform: scale(1.06); box-shadow: 0 0 0 7px rgba(255,4,0,0); }
  }

  @media (prefers-reduced-motion: reduce){
    .enter-btn{ animation: none; }
  }

  .pulse-line{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .ekg-trace{
    fill: none;
    stroke: rgba(255,255,255,.4);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .travel-pulse{
    fill: none;
    stroke: #fff;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 2px rgba(255,255,255,.5));
    animation: travel 7s linear infinite;
  }

  @keyframes travel{
    from{ stroke-dashoffset: var(--pulse-start, 0); }
    to{ stroke-dashoffset: var(--pulse-end, 0); }
  }

  .wire-strand{
    fill: none;
    stroke: url(#chainSteel);
    stroke-width: 1.5;
    stroke-linecap: round;
  }

  .wire-barb line{
    stroke: url(#chainSteel);
    stroke-width: 1.6;
    stroke-linecap: round;
  }

  .wire-barb circle{
    fill: url(#chainSteel);
  }

  @media (prefers-reduced-motion: reduce){
    .travel-pulse{ animation: none; }
    .bg, .render{ animation: none; }
  }

  .seam{
    position: absolute;
    left: 33.333%;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(255,255,255,.35);
    z-index: 5;
  }

  .seam + .seam{ left: 66.667%; }

  /* credit, top right corner: bottom-right ya lo ocupa el watermark propio
     de cada especial, así que el crédito compartido de LaPatilla va arriba,
     libre de los bloques de texto y de la línea del seam. */
  .credit{
    position: absolute;
    top: 4%;
    right: 2.45%;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(0,0,0,.45);
    padding: clamp(2px, .4cqw, 3px) clamp(6px, 1.2cqw, 9px);
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
  }

  .credit-label{
    font-size: clamp(6px, .95cqw, 7px);
    font-weight: 700;
    letter-spacing: .02em;
    color: rgba(255,255,255,.75);
  }

  .credit img{
    height: clamp(8px, 1.15cqw, 9px);
    width: auto;
    display: block;
  }

  @container (max-width: 420px){
    .credit{ display: none; }
  }
</style>
</head>
<body>

<div class="banner-wrap">
  <div class="banner" id="bannerRoot">

    <a class="half" href="https://especialhospitales.lapatilla.com/" target="_blank" rel="noopener noreferrer" aria-label="Las ruinas del sistema de salud, especial de La Patilla">
      <div class="bg bg-hospitales"></div>
      <div class="overlay"></div>
      <img class="brand-mark" src="img/ruinas-icon.png" alt="">
      <div class="copy">
        <span class="tag">Especial &middot; Salud pública</span>
        <p class="headline">Las ruinas del sistema de salud</p>
        <span class="enter-btn">Ver especial &rarr;</span>
      </div>
    </a>

    <a class="half fresh" href="https://especialdamnificadosterremoto.lapatilla.com/" target="_blank" rel="noopener noreferrer" aria-label="Abandonados tras los terremotos, especial de La Patilla sobre los damnificados del 24 de junio">
      <div class="bg bg-terremoto"></div>
      <div class="overlay"></div>
      <img class="brand-mark" src="img/sismo-icon.png" alt="">
      <div class="copy">
        <span class="tag">Especial &middot; Damnificados</span>
        <p class="headline">Abandonados tras los terremotos</p>
        <span class="enter-btn">Ver especial &rarr;</span>
      </div>
    </a>

    <a class="half" href="https://especialtorturas.lapatilla.com/" target="_blank" rel="noopener noreferrer" aria-label="Centros del horror, especial de La Patilla sobre tortura en Venezuela">
      <div class="bg bg-torturas">
        <img class="render" src="img/helicoide.png" alt="">
      </div>
      <div class="overlay"></div>
      <img class="brand-mark" src="img/horror-icon-duotone.png" alt="">
      <div class="copy">
        <span class="tag">Especial &middot; Derechos humanos</span>
        <p class="headline">Centros del horror</p>
        <span class="enter-btn">Ver especial &rarr;</span>
      </div>
    </a>

    <svg class="pulse-line" viewBox="0 0 980 200" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="chainSteel" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#eef0f1" />
          <stop offset="22%" stop-color="#9aa0a6" />
          <stop offset="48%" stop-color="#54585c" />
          <stop offset="70%" stop-color="#c9ccd0" />
          <stop offset="100%" stop-color="#45484c" />
        </linearGradient>
      </defs>
      <path class="ekg-trace" id="ekgTrace" />
      <path class="wire-strand" id="wireStrandA" />
      <path class="wire-strand" id="wireStrandB" />
      <path class="travel-pulse" id="travelPulse" />
      <g id="wireBarbs"></g>
    </svg>

    <div class="seam" aria-hidden="true"></div>
    <div class="seam" aria-hidden="true"></div>

    <div class="credit" aria-hidden="true">
      <span class="credit-label">Desarrollado por</span>
      <img src="img/lp-logo-light.png" alt="">
    </div>

  </div>
</div>

<script>
  var BASELINE = 57;

  function buildEkgPath(x0, x1, amp){
    var unit = 70;
    var d = 'M' + x0 + ',' + BASELINE;
    for (var x = x0; x < x1 - unit; x += unit){
      d += ' L' + (x + 8) + ',' + BASELINE;
      d += ' Q' + (x + 14) + ',' + (BASELINE - amp * 0.18) + ' ' + (x + 20) + ',' + BASELINE;
      d += ' L' + (x + 28) + ',' + BASELINE;
      d += ' L' + (x + 32) + ',' + (BASELINE + amp * 0.16);
      d += ' L' + (x + 36) + ',' + (BASELINE - amp * 1.05);
      d += ' L' + (x + 40) + ',' + (BASELINE + amp * 0.35);
      d += ' L' + (x + 44) + ',' + BASELINE;
      d += ' L' + (x + 52) + ',' + BASELINE;
      d += ' Q' + (x + 60) + ',' + (BASELINE - amp * 0.32) + ' ' + (x + 68) + ',' + BASELINE;
    }
    d += ' L' + x1 + ',' + BASELINE;
    return d;
  }

  // sismograma: ruido de fondo + dos sacudidas (el doblete del 24J, 7,2 y
  // luego 7,5), arranque brusco y cola que decae lenta.
  function buildSeismoPath(x0, x1, asContinuation){
    var L = x1 - x0;
    var shocks = [[x0 + L * 0.3, 14], [x0 + L * 0.62, 21]];
    var d = asContinuation ? '' : 'M' + x0 + ',' + BASELINE;
    var i = 0;
    for (var x = x0 + 2; x <= x1; x += 2, i++){
      var env = 1.2;
      shocks.forEach(function (s){
        var dx = x - s[0];
        env += s[1] * (dx < 0 ? Math.exp(-Math.pow(dx / 5, 2)) : Math.exp(-dx / 28));
      });
      var n = 0.45 + 0.55 * Math.abs(Math.sin(x * 0.37) * Math.cos(x * 0.11));
      d += ' L' + x + ',' + (BASELINE + (i % 2 ? 1 : -1) * env * n).toFixed(1);
    }
    return d;
  }

  function buildTwistStrand(x0, x1, amp, wavelength, phase, asContinuation){
    var d = asContinuation ? '' : 'M' + x0 + ',' + (BASELINE + Math.sin(phase) * amp);
    var step = 6;
    for (var x = x0 + step; x <= x1; x += step){
      var t = (x - x0) / wavelength * Math.PI * 2;
      var y = BASELINE + Math.sin(t + phase) * amp;
      d += ' L' + x.toFixed(1) + ',' + y.toFixed(1);
    }
    return d;
  }

  function buildBarbs(x0, x1, amp, wavelength, spacing){
    var svgNS = 'http://www.w3.org/2000/svg';
    var group = document.getElementById('wireBarbs');
    var spikeLen = 7;
    var angles = [25, 115, 205, 295];
    var i = 0;
    for (var x = x0 + spacing * 0.5; x <= x1 - spacing * 0.3; x += spacing){
      var t = (x - x0) / wavelength * Math.PI * 2;
      var y = BASELINE + Math.sin(t) * amp;
      var g = document.createElementNS(svgNS, 'g');
      g.setAttribute('class', 'wire-barb');
      angles.forEach(function (baseAngle){
        var rad = (baseAngle + (i % 2 ? 12 : -12)) * Math.PI / 180;
        var line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', x.toFixed(1));
        line.setAttribute('y1', y.toFixed(1));
        line.setAttribute('x2', (x + Math.cos(rad) * spikeLen).toFixed(1));
        line.setAttribute('y2', (y + Math.sin(rad) * spikeLen).toFixed(1));
        g.appendChild(line);
      });
      var knot = document.createElementNS(svgNS, 'circle');
      knot.setAttribute('cx', x.toFixed(1));
      knot.setAttribute('cy', y.toFixed(1));
      knot.setAttribute('r', 2.1);
      g.appendChild(knot);
      group.appendChild(g);
      i++;
    }
  }

  var ekgTrace = document.getElementById('ekgTrace');
  var wireStrandA = document.getElementById('wireStrandA');
  var wireStrandB = document.getElementById('wireStrandB');
  var travelPulse = document.getElementById('travelPulse');

  var A = 327, B = 653;   // cortes entre las tres tarjetas, en el viewBox de 980

  var ekgD = buildEkgPath(0, A, 19);
  ekgTrace.setAttribute('d', ekgD + ' ' + buildSeismoPath(A, B, true));

  wireStrandA.setAttribute('d', buildTwistStrand(B, 980, 7, 42, 0));
  wireStrandB.setAttribute('d', buildTwistStrand(B, 980, 7, 42, Math.PI));
  buildBarbs(B, 980, 7, 42, 30);

  var fullPulseD = ekgD + ' ' + buildSeismoPath(A, B, true) + ' ' + buildTwistStrand(B, 980, 7, 42, 0, true);
  travelPulse.setAttribute('d', fullPulseD);

  var pulseLen = travelPulse.getTotalLength();
  var dash = 46;
  travelPulse.style.strokeDasharray = dash + ' ' + pulseLen;
  travelPulse.style.setProperty('--pulse-start', '0');
  travelPulse.style.setProperty('--pulse-end', -(pulseLen + dash));
</script>

</body>
</html>
